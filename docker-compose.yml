services:
  # ── Caddy (reverse proxy with auto HTTPS) ──
  caddy:
    image: caddy:2-alpine
    container_name: hungarian-bites-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /home/sodlex/logs:/var/log/caddy

  # ── Cloudflare Tunnel ──
  # Run: scripts/tunnel.sh setup to activate
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hungarian-bites-tunnel
    restart: unless-stopped
    network_mode: host
    profiles:
      - tunnel
    volumes:
      - ~/.cloudflared:/home/nonroot/.cloudflared
      - ./cloudflare/tunnel.yml:/etc/cloudflared/config.yml:ro
    command: tunnel run --config /etc/cloudflared/config.yml

volumes:
  caddy_data:
  caddy_config:
